name: Gyre Energy
description: >-
  Gyre Energy is a UK-based climate-tech company that reduces cooling costs for
  operators of cold storage facilities, data centers, and building portfolios by
  combining artificial intelligence with thermal energy storage. Its platform pairs
  Gyre AI, a digital twin that learns a facility's thermal behavior and shifts cooling
  cycles to run when grid energy is cheapest and greenest, with an integrated thermal
  energy storage "cold battery" and a real-time monitoring and controls layer that
  tracks temperature, energy use, and door-open events. The company reports up to 50%
  lower cooling expenses, 38% verified energy cost savings at its first commercial cold
  storage deployment, a 91% reduction in temperature excursions, and a payback period of
  under 1.5 years. Gyre Energy is a portfolio company of Speedinvest and, as of July 2026,
  secured $1.3m in funding to support a major blue-chip deployment and global scaling.
  It currently exposes no public developer API, documentation, or developer portal; this
  profile captures its identity and public web surface for the API Evangelist network.
